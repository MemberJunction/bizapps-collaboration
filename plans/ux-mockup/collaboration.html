<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Collaboration — visual direction</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
<style>
  :root {
    --mj-color-brand-50: #e6f3f9;
    --mj-color-brand-100: #b3dbed;
    --mj-color-brand-400: #2699cc;
    --mj-color-brand-500: #0076b6;
    --mj-color-brand-600: #006aa3;
    --mj-color-brand-900: #092340;
    --mj-color-accent-50: #f0faff;
    --mj-color-accent-400: #5cc0ed;
    --mj-color-neutral-0: #ffffff;
    --mj-color-neutral-50: #f8fafc;
    --mj-color-neutral-100: #f1f5f9;
    --mj-color-neutral-200: #e2e8f0;
    --mj-color-neutral-300: #cbd5e1;
    --mj-color-neutral-400: #94a3b8;
    --mj-color-neutral-500: #64748b;
    --mj-color-neutral-600: #475569;
    --mj-color-neutral-700: #334155;
    --mj-color-neutral-800: #1e293b;
    --mj-bg-page: #f4f7fb;
    --mj-bg-surface: #ffffff;
    --mj-text-primary: #1e293b;
    --mj-text-secondary: #475569;
    --mj-text-muted: #64748b;
    --mj-border: #e2e8f0;
    --mj-brand: #0076b6;
    --mj-navy: #092340;
    --mj-success: #15803d;
    --mj-success-bg: #f0fdf4;
    --mj-warning-bg: #fffbeb;
    --mj-warning-text: #b45309;
    --shadow: 0 1px 2px rgba(9, 35, 64, 0.06), 0 8px 24px rgba(9, 35, 64, 0.04);
    --radius: 14px;
    --font: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    font-family: var(--font);
    color: var(--mj-text-primary);
    background: var(--mj-bg-page);
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  .app { display: grid; grid-template-columns: 292px 1fr; height: 100vh; }

  .rail {
    background: var(--mj-navy);
    color: #e8eef6;
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 22px 20px 14px;
  }
  .mark {
    width: 36px; height: 36px; border-radius: 10px;
    background: linear-gradient(160deg, #2699cc, #0076b6 55%, #092340);
    display: grid; place-items: center; color: white; font-weight: 700;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.18);
  }
  .brand h1 { margin: 0; font-size: 16px; font-weight: 650; letter-spacing: -0.02em; }
  .brand p { margin: 2px 0 0; font-size: 12px; color: #9fb0c6; }
  .rail-search {
    margin: 0 16px 12px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    display: flex; align-items: center; gap: 8px;
    padding: 8px 10px; color: #9fb0c6;
  }
  .rail-search input {
    background: transparent; border: 0; outline: none; width: 100%; color: white;
  }
  .rail-search input::placeholder { color: #7e91a8; }
  .new-space {
    margin: 0 16px 16px;
    background: #0076b6; color: white; border: 0; border-radius: 10px;
    padding: 10px 12px; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 8px;
  }
  .new-space:hover { background: #006aa3; }
  .tree { overflow: auto; padding: 0 10px 20px; flex: 1; }
  .group-label {
    margin: 14px 10px 6px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #7e91a8; font-weight: 600;
  }
  .node {
    width: 100%; text-align: left; border: 0; background: transparent; color: #d7e2ee;
    border-radius: 10px; padding: 8px 10px; display: flex; gap: 10px; align-items: center;
  }
  .node.child { margin-left: 18px; width: calc(100% - 18px); }
  .node:hover { background: rgba(255,255,255,0.06); }
  .node.on { background: rgba(255,255,255,0.1); box-shadow: inset 3px 0 0 #5cc0ed; color: white; }
  .node i.kind { width: 16px; text-align: center; color: #8eb6d4; }
  .node .nm { font-weight: 600; font-size: 13.5px; }
  .node .sub { display: block; font-size: 11px; color: #8ea0b5; font-weight: 400; margin-top: 1px; }
  .dot { width: 7px; height: 7px; border-radius: 99px; background: #4ade80; margin-left: auto; flex: none; }
  .dot.closed { background: #94a3b8; }

  .stage { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .top {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 14px 28px 0;
  }
  .crumb { color: var(--mj-text-muted); font-size: 13px; }
  .crumb strong { color: var(--mj-text-primary); font-weight: 600; }
  .viewer {
    display: flex; align-items: center; gap: 8px; background: white; border: 1px solid var(--mj-border);
    border-radius: 999px; padding: 4px; box-shadow: var(--shadow);
  }
  .viewer span { font-size: 12px; color: var(--mj-text-muted); padding-left: 8px; }
  .viewer button {
    border: 0; background: transparent; border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--mj-text-secondary);
  }
  .viewer button.on { background: var(--mj-navy); color: white; }

  .head { padding: 18px 28px 0; display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; }
  .kicker { margin: 0 0 6px; font-size: 12px; font-weight: 650; letter-spacing: 0.06em; text-transform: uppercase; color: var(--mj-brand); }
  .head h2 { margin: 0; font-size: 32px; letter-spacing: -0.03em; font-weight: 680; }
  .purpose { margin: 6px 0 0; color: var(--mj-text-secondary); max-width: 640px; line-height: 1.45; }
  .chips { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
  .chip {
    font-size: 12px; font-weight: 600; border-radius: 999px; padding: 4px 10px;
    background: white; border: 1px solid var(--mj-border); color: var(--mj-text-secondary);
  }
  .chip.open { background: var(--mj-success-bg); color: var(--mj-success); border-color: #bbf7d0; }
  .chip.team { background: #eef4fb; color: var(--mj-navy); border-color: #d5e3f2; }
  .chip.shared { background: var(--mj-color-accent-50); color: #1d7299; border-color: #bae8fd; }
  .who-stack { display: flex; align-items: center; }
  .av {
    width: 32px; height: 32px; border-radius: 99px; display: grid; place-items: center;
    color: white; font-size: 12px; font-weight: 700; border: 2px solid var(--mj-bg-page); margin-left: -8px;
  }
  .av:first-child { margin-left: 0; }
  .count { margin-left: 10px; font-size: 13px; color: var(--mj-text-muted); }

  .tabs {
    display: flex; gap: 4px; padding: 16px 28px 0; border-bottom: 1px solid var(--mj-border);
  }
  .tabs button {
    border: 0; background: transparent; padding: 10px 14px 12px; font-weight: 600; color: var(--mj-text-muted);
    border-bottom: 2px solid transparent; margin-bottom: -1px;
  }
  .tabs button.on { color: var(--mj-navy); border-bottom-color: var(--mj-brand); }
  .tabs button i { margin-right: 7px; }

  .body { overflow: auto; padding: 22px 28px 40px; flex: 1; }
  .grid { display: grid; grid-template-columns: 1.5fr 0.9fr; gap: 16px; }
  .card {
    background: white; border: 1px solid var(--mj-border); border-radius: var(--radius); box-shadow: var(--shadow);
  }
  .card h3 { margin: 0; font-size: 15px; letter-spacing: -0.01em; }
  .card-h { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px 0; }
  .card-b { padding: 12px 18px 18px; }
  .linkish { border: 0; background: transparent; color: var(--mj-brand); font-weight: 600; font-size: 13px; }

  .next {
    display: grid; grid-template-columns: 92px 1fr auto; gap: 16px; align-items: center;
    padding: 8px 0 4px;
  }
  .date-block {
    background: var(--mj-color-brand-50); color: var(--mj-navy); border-radius: 12px; text-align: center; padding: 10px 6px;
  }
  .date-block b { display: block; font-size: 20px; letter-spacing: -0.03em; }
  .date-block span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--mj-brand); font-weight: 700; }
  .next p { margin: 4px 0 0; color: var(--mj-text-secondary); font-size: 14px; }
  .status {
    font-size: 12px; font-weight: 700; border-radius: 999px; padding: 4px 8px;
  }
  .status.open { background: #e0f2fe; color: #075985; }
  .status.progress { background: #eef2ff; color: #4338ca; }
  .status.done { background: var(--mj-success-bg); color: var(--mj-success); }

  .plan-row, .person, .file, .msg {
    display: flex; gap: 12px; align-items: center; padding: 10px 0;
    border-top: 1px solid var(--mj-border);
  }
  .plan-row:first-child, .person:first-child, .file:first-child { border-top: 0; }
  .plan-row button.task {
    border: 0; background: transparent; text-align: left; flex: 1; padding: 0;
  }
  .plan-row button.task strong { display: block; }
  .plan-row button.task span, .muted { color: var(--mj-text-muted); font-size: 13px; }
  .depth-1 { margin-left: 22px; }
  .depth-2 { margin-left: 44px; }
  .bar { width: 3px; align-self: stretch; border-radius: 99px; background: var(--mj-brand); }
  .bar.team { background: var(--mj-navy); }
  .bar.muted { background: var(--mj-color-neutral-300); }

  .quote { font-size: 14px; line-height: 1.45; margin: 0; }
  .quote + .quote { margin-top: 12px; }
  .by { font-size: 12px; color: var(--mj-text-muted); margin-top: 3px; }

  .roster .person { align-items: flex-start; }
  .person .meta { flex: 1; }
  .person strong { display: block; }
  .actions { display: flex; gap: 8px; }
  .btn {
    border: 1px solid var(--mj-border); background: white; border-radius: 10px; padding: 8px 12px; font-weight: 600;
  }
  .btn.primary { background: var(--mj-brand); color: white; border-color: var(--mj-brand); }
  .btn.primary:hover { background: var(--mj-color-brand-600); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }

  .split { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
  .invite label, .sheet label { display: block; font-size: 12px; font-weight: 650; color: var(--mj-text-secondary); margin-bottom: 12px; }
  .invite input, .invite select, .sheet input, .sheet select, .composer input {
    width: 100%; margin-top: 6px; border: 1px solid var(--mj-border); border-radius: 10px; padding: 10px 12px; background: white;
  }
  .verdict { background: var(--mj-success-bg); color: var(--mj-success); border-radius: 10px; padding: 10px 12px; font-size: 13px; font-weight: 600; }
  .verdict.no { background: #fef2f2; color: #b91c1c; }

  .lib { display: grid; grid-template-columns: 220px 1fr; gap: 16px; }
  .folder {
    width: 100%; text-align: left; border: 0; background: transparent; border-radius: 10px; padding: 8px 10px; display: flex; gap: 8px; align-items: center;
  }
  .folder.on { background: var(--mj-color-brand-50); color: var(--mj-navy); font-weight: 650; }
  .files { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
  .file-card { padding: 14px; }
  .file-card .ic {
    width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: var(--mj-color-brand-50); color: var(--mj-brand); margin-bottom: 10px;
  }
  .drop {
    border: 1.5px dashed #b3dbed; background: #f6fbfe; border-radius: var(--radius); padding: 16px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px;
  }

  .thread { display: flex; flex-direction: column; gap: 12px; max-width: 760px; }
  .bubble { max-width: 560px; background: white; border: 1px solid var(--mj-border); border-radius: 16px; padding: 12px 14px; box-shadow: var(--shadow); }
  .bubble.mine { margin-left: auto; background: var(--mj-navy); color: white; border-color: var(--mj-navy); }
  .bubble.mine .by { color: #b9c7d8; }
  .composer { display: flex; gap: 8px; margin-top: 16px; max-width: 760px; }
  .composer input { flex: 1; }

  .drawer-back {
    position: fixed; inset: 0; background: rgba(9, 35, 64, 0.35); display: flex; justify-content: flex-end;
  }
  .drawer {
    width: min(440px, 100%); background: white; height: 100%; padding: 22px; overflow: auto;
    box-shadow: -12px 0 40px rgba(9, 35, 64, 0.15);
  }
  .drawer h3 { margin: 8px 0 4px; font-size: 24px; letter-spacing: -0.03em; }
  .sheet-back { position: fixed; inset: 0; background: rgba(9, 35, 64, 0.35); display: grid; place-items: center; padding: 24px; }
  .sheet { width: min(480px, 100%); background: white; border-radius: 18px; padding: 22px; box-shadow: var(--shadow); }
  .note {
    margin: 12px 28px 0; background: #fff7ed; color: #9a3412; border-radius: 12px; padding: 10px 12px; font-size: 13px;
    display: flex; justify-content: space-between; gap: 12px; align-items: center;
  }
  .note button { border: 0; background: transparent; font-weight: 700; color: inherit; }
  .empty {
    padding: 28px; text-align: center; color: var(--mj-text-secondary);
  }
  .empty i { font-size: 22px; color: var(--mj-brand); display: block; margin-bottom: 8px; }
  @media (max-width: 980px) {
    .app { grid-template-columns: 1fr; }
    .rail { display: none; }
    .grid, .split, .lib { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>
<div class="app">
  <aside class="rail">
    <div class="brand">
      <div class="mark">C</div>
      <div>
        <h1>Collaboration</h1>
        <p>Rooms for the work you share</p>
      </div>
    </div>
    <div class="rail-search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="Find a space" /></div>
    <button class="new-space" id="open-create"><i class="fa-solid fa-plus"></i> New space</button>
    <nav class="tree" id="tree" aria-label="Spaces"></nav>
  </aside>
  <section class="stage">
    <div class="top">
      <div class="crumb" id="crumb"></div>
      <div class="viewer" role="group" aria-label="Who is looking">
        <span>View as</span>
        <button type="button" id="as-ada" class="on">Ada · staff</button>
        <button type="button" id="as-bea">Bea · client</button>
      </div>
    </div>
    <div class="note" id="banner">
      <span>Visual direction only. The live app on port 4201 is unchanged. This is the same People, Library, Work, and Conversation, composed as one room.</span>
      <button type="button" id="dismiss">Hide</button>
    </div>
    <header class="head" id="head"></header>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="body" id="body"></div>
  </section>
</div>
<div id="overlay"></div>
<script>
const people = {
  ada: { name: "Ada Owner", role: "Owner", band: "Team", email: "ada.owner@collab-world.example", initials: "AO", color: "#092340" },
  bea: { name: "Bea Member", role: "Client member", band: "Shared", email: "bea.member@collab-world.example", initials: "BM", color: "#0076b6" },
  nia: { name: "Nia Director", role: "Director", band: "Shared", email: "nia.director@collab-world.example", initials: "ND", color: "#0e7490" },
  leo: { name: "Leo Learner", role: "Learner", band: "Shared", email: "leo.learner@collab-world.example", initials: "LL", color: "#7c3aed" },
  harbor: { name: "Harbor Owner", role: "Owner", band: "Team", email: "harbor.owner@collab-world.example", initials: "HO", color: "#334155" }
};

const spaces = [
  { id: "northwind", name: "Northwind Traders", group: "Engagements", kind: "Engagement", parent: null, open: true, purpose: "The relationship. Discovery and delivery live underneath it.", icon: "fa-building" },
  { id: "discovery", name: "Discovery", group: "Engagements", kind: "Engagement", parent: "northwind", open: true, purpose: "What we will learn before anyone writes a proposal. The client can see the shared plan.", icon: "fa-compass" },
  { id: "proposal", name: "Proposal", group: "Engagements", kind: "Engagement", parent: "northwind", open: true, purpose: "Drafted after discovery. Still staff-only.", icon: "fa-file-signature", staffOnly: true },
  { id: "audit", name: "Audit committee", group: "Governance", kind: "Committee", parent: null, open: true, purpose: "The committee's own room. Directors see the shared agenda. Staff notes stay on the team band.", icon: "fa-landmark" },
  { id: "cohort", name: "Spring cohort", group: "Learning", kind: "Cohort", parent: null, open: true, purpose: "One room for the cohort. Materials are shared. Instructor notes stay with the team.", icon: "fa-graduation-cap" },
  { id: "harbor", name: "Harbor renewal", group: "Closed", kind: "Engagement", parent: null, open: false, purpose: "Closed in August. The record stays. Nothing new is filed here.", icon: "fa-box-archive" }
];

const members = {
  northwind: ["ada"],
  discovery: ["ada", "bea"],
  proposal: ["ada"],
  audit: ["ada", "nia"],
  cohort: ["ada", "leo"],
  harbor: ["harbor"]
};

const tasks = {
  discovery: [
    { id: "plan", name: "Discovery plan", depth: 0, status: "In progress", who: "Ada Owner", band: "Shared", detail: "The shared plan the client can read. Ada is assigned." },
    { id: "visit", name: "Site visit", depth: 1, status: "Open", who: "Bea Member", band: "Shared", parent: "Discovery plan", detail: "Thursday on site. Bea owns the visit. The comment thread is on the task." },
    { id: "follow", name: "Follow-up call", depth: 2, status: "Open", who: "Unassigned", band: "Shared", parent: "Site visit", detail: "Filed under the site visit. A participant can add it. Assigning from the edit panel waits on the tasks release." },
    { id: "prep", name: "Internal prep", depth: 0, status: "Open", who: "Ada Owner", band: "Team", detail: "Staff only. Bea does not see this row.", staffOnly: true }
  ],
  audit: [
    { id: "agenda", name: "September agenda", depth: 0, status: "Open", who: "Nia Director", band: "Shared", detail: "Shared with the directors." },
    { id: "notes", name: "Staff briefing", depth: 0, status: "Open", who: "Ada Owner", band: "Team", detail: "Not on the director band.", staffOnly: true }
  ],
  cohort: [
    { id: "week", name: "Week 3 studio", depth: 0, status: "Open", who: "Leo Learner", band: "Shared", detail: "The session the cohort can see." }
  ]
};

const files = {
  discovery: [
    { folder: "Shared", name: "Scope of discovery.pdf", kind: "PDF", band: "Shared" },
    { folder: "Shared", name: "Site map.png", kind: "Image", band: "Shared" },
    { folder: "Shared", name: "Visit notes.docx", kind: "Document", band: "Shared" },
    { folder: "Team", name: "Pricing worksheet.xlsx", kind: "Sheet", band: "Team", staffOnly: true },
    { folder: "Team", name: "Risk memo.pdf", kind: "PDF", band: "Team", staffOnly: true }
  ],
  audit: [
    { folder: "Shared", name: "September packet.pdf", kind: "PDF", band: "Shared" },
    { folder: "Team", name: "Draft minutes.docx", kind: "Document", band: "Team", staffOnly: true }
  ],
  cohort: [
    { folder: "Shared", name: "Week 3 brief.pdf", kind: "PDF", band: "Shared" }
  ]
};

const messages = {
  discovery: [
    { who: "Ada Owner", mine: false, text: "The site visit is on the plan for Thursday. Photos go in Shared when you are back.", time: "Yesterday" },
    { who: "Bea Member", mine: true, text: "Checked the date. I will bring the floor plan.", time: "Yesterday" }
  ],
  audit: [
    { who: "Nia Director", mine: false, text: "Please hold the packet until the chair has seen the numbers.", time: "Monday" }
  ]
};

const state = { space: "discovery", tab: "overview", as: "ada", folder: "Shared", task: null, create: false, banner: true, q: "" };

function visibleSpaces() {
  const q = state.q.trim().toLowerCase();
  return spaces.filter((space) => {
    if (state.as === "bea" && space.id !== "discovery" && space.id !== "northwind") return false;
    if (state.as === "bea" && space.staffOnly) return false;
    if (q && !space.name.toLowerCase().includes(q)) return false;
    return true;
  });
}

function spaceById(id) { return spaces.find((space) => space.id === id); }

function peopleHere() {
  return (members[state.space] || []).map((id) => people[id]).filter((person) => state.as === "ada" || person.band !== "Team" || person.name.startsWith("Bea"));
}

function tasksHere() {
  return (tasks[state.space] || []).filter((task) => state.as === "ada" || !task.staffOnly);
}

function filesHere() {
  return (files[state.space] || []).filter((file) => (state.as === "ada" || !file.staffOnly) && file.folder === state.folder);
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[ch]));
}

function renderTree() {
  const groups = [];
  for (const space of visibleSpaces()) {
    if (space.parent && !visibleSpaces().some((row) => row.id === space.parent)) continue;
    if (!groups.includes(space.group)) groups.push(space.group);
  }
  document.getElementById("tree").innerHTML = groups.map((group) => {
    const rows = visibleSpaces().filter((space) => space.group === group && !space.parent)
      .concat(visibleSpaces().filter((space) => space.group === group && space.parent));
    const ordered = [];
    for (const root of visibleSpaces().filter((space) => space.group === group && !space.parent)) {
      ordered.push(root);
      ordered.push(...visibleSpaces().filter((space) => space.parent === root.id));
    }
    return `<div class="group-label">${group}</div>` + ordered.map((space) => `
      <button class="node ${space.parent ? "child" : ""} ${space.id === state.space ? "on" : ""}" data-space="${space.id}">
        <i class="fa-solid ${space.icon} kind"></i>
        <span><span class="nm">${escapeHtml(space.name)}</span><span class="sub">${escapeHtml(space.kind)}</span></span>
        <i class="dot ${space.open ? "" : "closed"}" title="${space.open ? "Open" : "Closed"}"></i>
      </button>`).join("");
  }).join("");
}

function renderHead() {
  const space = spaceById(state.space);
  const parent = space.parent ? spaceById(space.parent) : null;
  document.getElementById("crumb").innerHTML = parent
    ? `${escapeHtml(parent.name)} / <strong>${escapeHtml(space.name)}</strong>`
    : `<strong>${escapeHtml(space.name)}</strong>`;
  const roster = peopleHere();
  document.getElementById("head").innerHTML = `
    <div>
      <p class="kicker">${escapeHtml(space.kind)}</p>
      <h2>${escapeHtml(space.name)}</h2>
      <p class="purpose">${escapeHtml(space.purpose)}</p>
      <div class="chips">
        <span class="chip ${space.open ? "open" : ""}">${space.open ? "Open" : "Closed"}</span>
        <span class="chip team">Team band for staff</span>
        <span class="chip shared">Shared band for the client</span>
      </div>
    </div>
    <div class="who-stack" title="People in this room">
      ${roster.map((person) => `<span class="av" style="background:${person.color}">${person.initials}</span>`).join("")}
      <span class="count">${roster.length} ${roster.length === 1 ? "person" : "people"}</span>
    </div>`;
  const tabs = [
    ["overview", "fa-table-columns", "Overview"],
    ["people", "fa-user-group", "People"],
    ["library", "fa-folder-open", "Library"],
    ["work", "fa-list-check", "Work"],
    ["talk", "fa-comments", "Conversation"]
  ];
  document.getElementById("tabs").innerHTML = tabs.map(([id, icon, label]) =>
    `<button type="button" role="tab" class="${state.tab === id ? "on" : ""}" data-tab="${id}"><i class="fa-solid ${icon}"></i>${label}</button>`
  ).join("");
}

function overview() {
  const list = tasksHere();
  const next = list.find((task) => task.status !== "Done") || list[0];
  const msgs = messages[state.space] || [];
  const recent = (files[state.space] || []).filter((file) => state.as === "ada" || !file.staffOnly).slice(0, 3);
  if (!next) {
    return `<div class="card empty"><i class="fa-solid fa-box-archive"></i><strong>This room is quiet.</strong><p>A closed space keeps its record and does not take new work.</p></div>`;
  }
  return `<div class="grid">
    <div>
      <article class="card">
        <div class="card-h"><h3>Next up</h3><button class="linkish" data-tab="work">Open the plan</button></div>
        <div class="card-b">
          <div class="next">
            <div class="date-block"><span>Thu</span><b>24</b></div>
            <div><strong>${escapeHtml(next.name)}</strong><p>${escapeHtml(next.detail)}</p></div>
            <span class="status ${next.status === "Open" ? "open" : "progress"}">${escapeHtml(next.status)}</span>
          </div>
        </div>
      </article>
      <article class="card" style="margin-top:16px">
        <div class="card-h"><h3>The plan</h3><span class="muted">${list.length} tasks</span></div>
        <div class="card-b">
          ${list.map((task) => `<div class="plan-row depth-${task.depth}"><i class="bar ${task.band === "Team" ? "team" : ""}"></i><button class="task" data-task="${task.id}"><strong>${escapeHtml(task.name)}</strong><span>${escapeHtml(task.who)} · ${escapeHtml(task.band)}</span></button><span class="status ${task.status === "Open" ? "open" : "progress"}">${escapeHtml(task.status)}</span></div>`).join("")}
        </div>
      </article>
    </div>
    <div>
      <article class="card">
        <div class="card-h"><h3>In the room</h3><button class="linkish" data-tab="talk">Conversation</button></div>
        <div class="card-b">
          ${msgs.map((msg) => `<p class="quote">“${escapeHtml(msg.text)}”</p><div class="by">${escapeHtml(msg.who)} · ${escapeHtml(msg.time)}</div>`).join("") || `<p class="muted">No messages yet.</p>`}
        </div>
      </article>
      <article class="card" style="margin-top:16px">
        <div class="card-h"><h3>Just shared</h3><button class="linkish" data-tab="library">Library</button></div>
        <div class="card-b">
          ${recent.map((file) => `<div class="file"><i class="fa-regular fa-file"></i><div><strong>${escapeHtml(file.name)}</strong><div class="muted">${escapeHtml(file.band)}</div></div></div>`).join("") || `<p class="muted">Nothing filed yet.</p>`}
        </div>
      </article>
    </div>
  </div>`;
}

function peoplePane() {
  const roster = peopleHere();
  const closed = !spaceById(state.space).open;
  return `<div class="split">
    <article class="card roster">
      <div class="card-h"><h3>People</h3><span class="muted">${state.as === "bea" ? "Bea sees her own seat, not staff above the space" : "Seats on this space"}</span></div>
      <div class="card-b">
        ${roster.map((person) => `<div class="person"><span class="av" style="background:${person.color};margin:0">${person.initials}</span><div class="meta"><strong>${escapeHtml(person.name)}</strong><span class="muted">${escapeHtml(person.email)}</span></div><span class="chip ${person.band === "Team" ? "team" : "shared"}">${escapeHtml(person.band)}</span><span class="chip">${escapeHtml(person.role)}</span></div>`).join("")}
      </div>
    </article>
    <article class="card invite">
      <div class="card-h"><h3>Invite</h3></div>
      <div class="card-b">
        ${closed ? `<p class="muted">A closed space does not take new people.</p>` : state.as === "bea" ? `<p class="muted">Bea can see the roster she reaches. Inviting is above her ceiling.</p>` : `
          <label>Email<input id="email" type="email" placeholder="nina@client.example" /></label>
          <label>Role<select id="role"><option>Client member</option><option>Client admin</option><option>Guest</option></select></label>
          <p class="verdict" id="verdict">They will join Discovery as an active client member, on the shared band.</p>
          <button class="btn primary" id="send" type="button">Send invite</button>`}
      </div>
    </article>
  </div>`;
}

function libraryPane() {
  const all = (files[state.space] || []).filter((file) => state.as === "ada" || !file.staffOnly);
  const folders = [...new Set(all.map((file) => file.folder))];
  if (!folders.includes(state.folder)) state.folder = folders[0] || "Shared";
  return `<div class="lib">
    <article class="card"><div class="card-b">
      ${folders.map((folder) => `<button class="folder ${folder === state.folder ? "on" : ""}" data-folder="${folder}"><i class="fa-regular fa-folder${folder === state.folder ? "-open" : ""}"></i>${folder}</button>`).join("") || `<p class="muted">No folders yet.</p>`}
    </div></article>
    <div>
      ${spaceById(state.space).open && state.as === "ada" ? `<div class="drop"><div><strong>Drop files into ${escapeHtml(state.folder)}</strong><div class="muted">Shared is what the client can open. Team stays with staff.</div></div><button class="btn" type="button">Upload</button></div>` : ""}
      <div class="files">
        ${filesHere().map((file) => `<article class="card file-card"><div class="ic"><i class="fa-regular fa-file"></i></div><strong>${escapeHtml(file.name)}</strong><div class="chips" style="margin-top:8px"><span class="chip ${file.band === "Team" ? "team" : "shared"}">${escapeHtml(file.band)}</span><span class="chip">${escapeHtml(file.kind)}</span></div></article>`).join("")}
        ${filesHere().length ? "" : `<article class="card empty">Nothing in this folder.</article>`}
      </div>
    </div>
  </div>`;
}

function workPane() {
  const list = tasksHere();
  if (!list.length) return `<article class="card empty"><i class="fa-solid fa-list-check"></i>No tasks filed in this space.</article>`;
  return `<article class="card"><div class="card-h"><h3>Work</h3><span class="muted">Filed from the space, then planned underneath</span></div><div class="card-b">
    ${list.map((task) => `<div class="plan-row depth-${task.depth}"><i class="bar ${task.band === "Team" ? "team" : ""}"></i><button class="task" data-task="${task.id}"><strong>${escapeHtml(task.name)}</strong><span>${escapeHtml(task.who)} · ${task.parent ? "Under " + escapeHtml(task.parent) : "Root of this space"}</span></button><span class="chip ${task.band === "Team" ? "team" : "shared"}">${escapeHtml(task.band)}</span><span class="status ${task.status === "Open" ? "open" : "progress"}">${escapeHtml(task.status)}</span></div>`).join("")}
  </div></article>`;
}

function talkPane() {
  const msgs = messages[state.space] || [];
  const closed = !spaceById(state.space).open;
  return `<div class="thread">
    ${msgs.map((msg) => `<div class="bubble ${state.as === "bea" && msg.who.startsWith("Bea") ? "mine" : ""}"><div>${escapeHtml(msg.text)}</div><div class="by">${escapeHtml(msg.who)} · ${escapeHtml(msg.time)}</div></div>`).join("") || `<article class="card empty">The room is quiet.</article>`}
  </div>
  ${closed ? `<p class="muted">A closed space keeps the transcript and does not take a new message.</p>` : `<form class="composer" id="composer"><input name="message" placeholder="Write in ${escapeHtml(spaceById(state.space).name)}" /><button class="btn primary" type="submit">Send</button></form>`}`;
}

function renderBody() {
  const panes = { overview, people: peoplePane, library: libraryPane, work: workPane, talk: talkPane };
  document.getElementById("body").innerHTML = panes[state.tab]();
  wireBody();
}

function wireBody() {
  document.querySelectorAll("[data-tab]").forEach((button) => button.addEventListener("click", () => { state.tab = button.dataset.tab; render(); }));
  document.querySelectorAll("[data-task]").forEach((button) => button.addEventListener("click", () => { state.task = button.dataset.task; renderOverlay(); }));
  document.querySelectorAll("[data-folder]").forEach((button) => button.addEventListener("click", () => { state.folder = button.dataset.folder; renderBody(); }));
  const email = document.getElementById("email");
  const verdict = document.getElementById("verdict");
  const send = document.getElementById("send");
  if (email && verdict) {
    const paint = () => {
      const ok = email.value.includes("@") && email.value.includes(".");
      verdict.className = "verdict" + (ok ? "" : " no");
      verdict.textContent = ok
        ? "They will join Discovery as an active client member, on the shared band."
        : "Enter a full email. The ceiling, the role, and the member cap are checked before anything is sent.";
      send.disabled = !ok;
    };
    email.addEventListener("input", paint);
    send.addEventListener("click", () => { verdict.textContent = "Invite sent to " + email.value + ". They get a sign-in link, not a password."; email.value = ""; send.disabled = true; });
  }
  const composer = document.getElementById("composer");
  if (composer) composer.addEventListener("submit", (event) => {
    event.preventDefault();
    const input = composer.querySelector("input");
    if (!input.value.trim()) return;
    (messages[state.space] ||= []).push({ who: state.as === "bea" ? "Bea Member" : "Ada Owner", text: input.value.trim(), time: "Just now" });
    renderBody();
  });
}

function renderOverlay() {
  const host = document.getElementById("overlay");
  if (state.task) {
    const task = (tasks[state.space] || []).find((row) => row.id === state.task);
    host.innerHTML = `<div class="drawer-back"><aside class="drawer">
      <button class="btn" id="close-drawer" type="button">Close</button>
      <p class="kicker">${escapeHtml(task.band)} · ${escapeHtml(task.status)}</p>
      <h3>${escapeHtml(task.name)}</h3>
      <p class="purpose">${escapeHtml(task.detail)}</p>
      <div class="chips"><span class="chip">${escapeHtml(task.who)}</span>${task.parent ? `<span class="chip">Subtask of ${escapeHtml(task.parent)}</span>` : `<span class="chip">Filed in this space</span>`}</div>
      <h3 style="font-size:16px;margin-top:22px">Comment</h3>
      <p class="quote">“The site visit is on the plan.”</p><div class="by">Ada Owner</div>
      <p class="quote">“Checked the date.”</p><div class="by">Bea Member</div>
      <form class="composer" style="max-width:none"><input placeholder="Add a comment" /><button class="btn primary" type="button">Post</button></form>
      <h3 style="font-size:16px;margin-top:8px">Subtask of ${escapeHtml(task.name)}</h3>
      <form class="composer" style="max-width:none"><input placeholder="Name" /><button class="btn" type="button">Add subtask</button></form>
    </aside></div>`;
    host.querySelector("#close-drawer").addEventListener("click", () => { state.task = null; host.innerHTML = ""; });
    host.querySelector(".drawer-back").addEventListener("click", (event) => { if (event.target === event.currentTarget) { state.task = null; host.innerHTML = ""; } });
    return;
  }
  if (state.create) {
    host.innerHTML = `<div class="sheet-back"><form class="sheet" id="create-form">
      <p class="kicker">New space</p>
      <h3 style="margin-top:0">Start a room</h3>
      <p class="purpose">A root space is one relationship. The work inside it is a sub-space.</p>
      <label>Name<input name="name" placeholder="Harbor onboarding" required /></label>
      <label>Type<select><option>Engagement</option><option>Committee</option><option>Cohort</option></select></label>
      <label style="display:flex;gap:8px;align-items:center"><input type="checkbox" style="width:auto" checked /> Place it under ${escapeHtml(spaceById(state.space).name)}</label>
      <div class="actions"><button class="btn" type="button" id="cancel-create">Cancel</button><button class="btn primary" type="submit">Create space</button></div>
    </form></div>`;
    host.querySelector("#cancel-create").addEventListener("click", () => { state.create = false; host.innerHTML = ""; });
    host.querySelector("#create-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const name = new FormData(event.target).get("name");
      spaces.push({ id: "new-" + Date.now(), name, group: "Engagements", kind: "Engagement", parent: state.space, open: true, purpose: "Just opened. Invite the first person, then file the work.", icon: "fa-folder-plus" });
      state.space = spaces[spaces.length - 1].id;
      state.create = false;
      state.tab = "overview";
      host.innerHTML = "";
      render();
    });
    return;
  }
  host.innerHTML = "";
}

function render() {
  document.getElementById("as-ada").classList.toggle("on", state.as === "ada");
  document.getElementById("as-bea").classList.toggle("on", state.as === "bea");
  document.getElementById("banner").style.display = state.banner ? "flex" : "none";
  renderTree();
  renderHead();
  renderBody();
  renderOverlay();
}

document.getElementById("tree").addEventListener("click", (event) => {
  const button = event.target.closest("[data-space]");
  if (!button) return;
  state.space = button.dataset.space;
  state.tab = "overview";
  state.folder = "Shared";
  state.task = null;
  render();
});
document.getElementById("as-ada").addEventListener("click", () => { state.as = "ada"; if (!visibleSpaces().some((space) => space.id === state.space)) state.space = "discovery"; render(); });
document.getElementById("as-bea").addEventListener("click", () => { state.as = "bea"; state.space = "discovery"; state.task = null; render(); });
document.getElementById("open-create").addEventListener("click", () => { state.create = true; renderOverlay(); });
document.getElementById("dismiss").addEventListener("click", () => { state.banner = false; render(); });
document.getElementById("q").addEventListener("input", (event) => { state.q = event.target.value; renderTree(); });
render();
</script>
</body>
</html>
