name: ci

on:
  pull_request:
    branches: [next]
  push:
    branches: [next, main]

jobs:
  build:
    name: Build, test, standards & visual e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # These three read the source and the installed packages, not a build, so they run before the build and are not held up by it
      - run: node scripts/strip-sync-blocks.mjs --check
      - run: node scripts/check-mj-tokens.mjs --self-test && node scripts/check-mj-tokens.mjs
      - run: node scripts/check-downstream-names.mjs
      - name: Check adopted MJ standards
        run: pnpm exec mj standards check
      - run: pnpm run build
      - run: pnpm test
      - run: node --check test-harnesses/integration.mjs && node --check test-harnesses/integration-client.mjs
      - name: Install Playwright Chromium
        run: pnpm --filter @mj-biz-apps/collaboration-e2e exec playwright install --with-deps chromium
      - name: Run Gallery Visual Tests
        run: pnpm run test:e2e
      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-test-results
          path: e2e/test-results/
          retention-days: 14

