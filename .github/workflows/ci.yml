name: ci

on:
  pull_request:
    branches: [next]
  push:
    branches: [next, main]

jobs:
  build:
    name: Build, test, standards & visual e2e
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm test
      - run: node scripts/check-mj-tokens.mjs
      - name: Check adopted MJ standards
        run: pnpm exec mj standards check
      - run: node --check test-harnesses/integration.mjs && node --check test-harnesses/integration-client.mjs
      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium
      - name: Run Gallery Visual Tests
        run: pnpm run test:e2e
