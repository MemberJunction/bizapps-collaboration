name: ci

on:
  pull_request:
    branches: [next, main, 'lts/**']
  push:
    branches: [next, main, 'lts/**']

jobs:
  build:
    name: Build, test, standards & visual e2e
    # Not ubuntu-latest: it moved to 26.04, which the e2e suite's Playwright (1.58.1) can not install a browser on.
    # Move back when Playwright is bumped to a release that supports it.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      # PRs into next (and next itself) build against MJ next and the sibling apps' next, from
      # source, in one generated pnpm workspace; release PRs and lts/* lines install the committed
      # lockfile, i.e. the published versions. See .github/actions/ci-install/action.yml.
      - name: Install dependencies
        uses: ./.github/actions/ci-install
      # These three read the source and the installed packages, not a build, so they run before the build and are not held up by it
      - run: node scripts/strip-sync-blocks.mjs --check
      - run: node scripts/check-mj-tokens.mjs --self-test && node scripts/check-mj-tokens.mjs
      - run: node scripts/check-downstream-names.mjs
      - run: node scripts/check-mj-inputs.mjs --self-test && node scripts/check-mj-inputs.mjs
      - run: node scripts/check-registered-exports.mjs --self-test && node scripts/check-registered-exports.mjs
      - run: node scripts/check-no-role-name-auth.mjs --self-test && node scripts/check-no-role-name-auth.mjs
      - name: Check adopted MJ standards
        run: pnpm exec mj standards check
      - run: pnpm run build
      - run: pnpm test
      - run: node --check test-harnesses/integration.mjs && node --check test-harnesses/integration-client.mjs
      - name: Install Playwright Chromium
        run: pnpm --filter @mj-biz-apps/collaboration-e2e exec playwright install --with-deps chromium
      - name: Run Gallery Visual Tests
        run: pnpm run test:e2e
      - name: Upload visual test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gallery-test-results
          path: e2e/test-results/
          retention-days: 14


  database:
    name: Build the database from empty, run the server harness and the persona check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    # The same procedure as docs/building-the-database.md, against a throwaway SQL Server: MemberJunction core at the
    # v6.3.0-edge.1 tag, bizapps-common at v5.65.0 and bizapps-tasks at v1.14.0 (the releases the package pins name, each checked
    # out by its tag's commit), then this app's baseline, metadata, test metadata and world. The client harness needs an MJAPI with
    # this app's packages loaded and is not run here.
    env:
      DB_HOST: localhost
      DB_PORT: '1433'
      DB_DATABASE: collab_ci
      DB_USERNAME: sa
      DB_PASSWORD: 'VeryStr0ngP@ssw0rd'
      CODEGEN_DB_USERNAME: sa
      CODEGEN_DB_PASSWORD: 'VeryStr0ngP@ssw0rd'
      DB_TRUST_SERVER_CERTIFICATE: '1'
      MJ_CORE_SCHEMA: __mj
      MJ_MIGRATION_REQUEST_TIMEOUT: '120000'
      MJ_CLI: ${{ github.workspace }}/node_modules/@memberjunction/cli/bin/run.js
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'VeryStr0ngP@ssw0rd'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: MemberJunction/MJ
          ref: 3706d7eb22f21a7e6eecee2358d250e01f385d31
          path: .ci/MJ
          # MJ's prompt templates @include files under these generated-for-prompt folders, so the push needs them too.
          sparse-checkout: |
            migrations
            metadata
            packages/AI/CorePlus/generated-for-prompt
            packages/AI/VideoStudio/Core/generated-for-prompt
      - uses: actions/checkout@v4
        with:
          repository: MemberJunction/bizapps-common
          ref: 5f1d764a153a17cb8f9bf48fed45cce06da39157
          path: .ci/bizapps-common
          sparse-checkout: |
            migrations
            metadata
      - uses: actions/checkout@v4
        with:
          repository: MemberJunction/bizapps-tasks
          ref: 1b3bedb237e852e4f91ceb12d4256103e88c1286
          path: .ci/bizapps-tasks
          sparse-checkout: |
            migrations
            metadata
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Wait for SQL Server and create the database
        run: |
          node --input-type=module -e "
            import sql from 'mssql';
            const cfg = { server: 'localhost', port: 1433, user: 'sa', password: process.env.DB_PASSWORD, options: { encrypt: true, trustServerCertificate: true }, connectionTimeout: 5000 };
            for (let attempt = 1; ; attempt += 1) {
              try {
                const pool = await new sql.ConnectionPool({ ...cfg, database: 'master' }).connect();
                await pool.request().query('SELECT 1');
                await pool.request().query('CREATE DATABASE [collab_ci]');
                await pool.close();
                console.log('SQL Server ready, database created (attempt ' + attempt + ')');
                break;
              } catch (error) {
                if (attempt >= 40) throw error;
                await new Promise((r) => setTimeout(r, 3000));
              }
            }"
      - name: A throwaway encryption key for this database
        # The sample world saves an MJ Credentials row, whose Values field MJ encrypts with this key.
        run: echo "MJ_BASE_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
      - name: MemberJunction core, migrations and metadata
        working-directory: .ci/MJ
        run: |
          node "$MJ_CLI" migrate
          node "$MJ_CLI" sync push --dir=metadata --ci
      - name: bizapps-common, with People field-level security
        working-directory: .ci/bizapps-common
        run: |
          node "$MJ_CLI" migrate --schema __mj_BizAppsCommon --dir ./migrations
          node "$MJ_CLI" sync push --dir=metadata --include=entities --ci
      - name: bizapps-tasks
        working-directory: .ci/bizapps-tasks
        run: node "$MJ_CLI" migrate --schema __mj_BizAppsTasks --dir ./migrations
      - name: This app's baseline and metadata
        run: |
          pnpm run mj:migrate
          pnpm exec mj sync push --dir=metadata --ci
      - name: The example type and the test metadata
        run: |
          pnpm run mj:migrate:examples
          pnpm run mj:push:tests
      - name: The data-reach metadata is what the types declare (B18)
        run: node scripts/generate-data-reach-filters.mjs --check
      - name: The sample world
        run: node packages/IntegrationTests/dist/world/load-world.js
      - name: Server harness, every declared check
        run: pnpm run test:integration:server
      - name: Persona check
        run: node scripts/run-sql-file.mjs scripts/persona-check.sql
      - name: Upload the harness log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-server-log
          path: integration-server.log
          retention-days: 14

  database-client:
    name: Build the database from empty and run the client harness (integration-client.mjs)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    if: (github.event_name == 'pull_request' && github.base_ref == 'next') || github.ref == 'refs/heads/next'
    permissions:
      contents: read
    env:
      DB_HOST: localhost
      DB_PORT: '1433'
      DB_DATABASE: collab_ci
      DB_USERNAME: sa
      DB_PASSWORD: 'VeryStr0ngP@ssw0rd'
      CODEGEN_DB_USERNAME: sa
      CODEGEN_DB_PASSWORD: 'VeryStr0ngP@ssw0rd'
      DB_TRUST_SERVER_CERTIFICATE: '1'
      MJ_CORE_SCHEMA: __mj
      MJ_MIGRATION_REQUEST_TIMEOUT: '120000'
      MJ_API_KEY: mj-collab-ci-${{ github.run_id }}
      GRAPHQL_PORT: '4000'
      MJAPI_PUBLIC_URL: 'http://127.0.0.1:4000'
      MJAPI_URL: 'http://127.0.0.1:4000'
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: 'VeryStr0ngP@ssw0rd'
        ports:
          - 1433:1433
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install joined workspace (MJ next + sibling apps)
        uses: ./.github/actions/ci-install
        with:
          mode: next
      - name: Build Collaboration, sibling server dependencies, and MJAPI
        run: |
          pnpm run build
          (cd .. && \
            node MJ/packages/MJAPI/scripts/ensure-manifest.mjs && \
            pnpm --filter @mj-biz-apps/common-actions --filter @mj-biz-apps/common-activity-sync --filter @mj-biz-apps/common-core-entities-server --filter @mj-biz-apps/tasks-core --filter @mj-biz-apps/tasks-entities-server --filter @mj-biz-apps/tasks-actions run build && \
            pnpm --filter @mj-biz-apps/common-server --filter @mj-biz-apps/tasks-server --filter mj_api run build)
      - name: Wait for SQL Server and create the database
        run: |
          node --input-type=module -e "
            import sql from 'mssql';
            const cfg = { server: 'localhost', port: 1433, user: 'sa', password: process.env.DB_PASSWORD, options: { encrypt: true, trustServerCertificate: true }, connectionTimeout: 5000 };
            for (let attempt = 1; ; attempt += 1) {
              try {
                const pool = await new sql.ConnectionPool({ ...cfg, database: 'master' }).connect();
                await pool.request().query('SELECT 1');
                await pool.request().query('CREATE DATABASE [collab_ci]');
                await pool.close();
                console.log('SQL Server ready, database created (attempt ' + attempt + ')');
                break;
              } catch (error) {
                if (attempt >= 40) throw error;
                await new Promise((r) => setTimeout(r, 3000));
              }
            }"
      - name: Throwaway encryption and magic-link keys for CI database
        run: |
          echo "MJ_BASE_ENCRYPTION_KEY=$(openssl rand -base64 32)" >> "$GITHUB_ENV"
          echo "MJ_MAGIC_LINK_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 2>/dev/null | base64 | tr -d '\n')" >> "$GITHUB_ENV"
      - name: MemberJunction core, migrations and metadata
        working-directory: ../MJ
        run: |
          node packages/MJCLI/bin/run.js migrate
          node packages/MJCLI/bin/run.js sync push --dir=metadata --ci
      - name: bizapps-common, with People field-level security
        working-directory: ../bizapps-common
        run: |
          node ../MJ/packages/MJCLI/bin/run.js migrate --schema __mj_BizAppsCommon --dir ./migrations
          node ../MJ/packages/MJCLI/bin/run.js sync push --dir=metadata --include=entities --ci
      - name: bizapps-tasks
        working-directory: ../bizapps-tasks
        run: node ../MJ/packages/MJCLI/bin/run.js migrate --schema __mj_BizAppsTasks --dir ./migrations
      - name: This app's baseline and metadata
        run: |
          node ../MJ/packages/MJCLI/bin/run.js migrate --schema __mj_BizAppsCollaboration
          node ../MJ/packages/MJCLI/bin/run.js sync push --dir=metadata --ci
      - name: The example type and the test metadata
        run: |
          node ../MJ/packages/MJCLI/bin/run.js migrate --schema __mj_BizAppsCollabExamples --dir packages/ExampleSpaceTypes/migrations
          node ../MJ/packages/MJCLI/bin/run.js sync push --dir=metadata-tests --include=row-level-security-filters,entity-permissions,entity-fields,entity-field-permissions,entities,queries,actions --ci
          node ../MJ/packages/MJCLI/bin/run.js sync push --dir=metadata-tests --include=agents,space-types,space-type-statuses,space-grants --ci
      - name: The data-reach metadata is what the types declare (B18)
        run: node scripts/generate-data-reach-filters.mjs --check
      - name: The sample world
        run: node packages/IntegrationTests/dist/world/load-world.js
      - name: Configure and boot MJAPI with Collaboration and example server packages
        run: |
          mkdir -p ../MJ/packages/MJAPI/node_modules/@mj-biz-apps
          ln -sfn "${{ github.workspace }}/../bizapps-common/packages/Server" ../MJ/packages/MJAPI/node_modules/@mj-biz-apps/common-server
          ln -sfn "${{ github.workspace }}/../bizapps-tasks/packages/Server" ../MJ/packages/MJAPI/node_modules/@mj-biz-apps/tasks-server
          ln -sfn "${{ github.workspace }}/packages/Server" ../MJ/packages/MJAPI/node_modules/@mj-biz-apps/collaboration-server
          ln -sfn "${{ github.workspace }}/packages/ExampleSpaceTypes/Server" ../MJ/packages/MJAPI/node_modules/@mj-biz-apps/collaboration-example-space-types-server
          cat > ../MJ/packages/MJAPI/mj.config.cjs <<'EOF'
          const base = require('../../mj.config.cjs');
          module.exports = {
            ...base,
            apiKey: process.env.MJ_API_KEY,
            magicLink: {
              ...(base.magicLink || {}),
              enabled: true,
              grantableRoleNames: ['Space Participant'],
              provisioningGuard: 'block',
            },
            dynamicPackages: {
              server: [
                { PackageName: '@mj-biz-apps/common-server', StartupExport: 'LoadBizAppsCommonServer', AppName: 'mj-bizapps-common', Enabled: true },
                { PackageName: '@mj-biz-apps/tasks-server', StartupExport: 'LoadBizAppsTasksServer', AppName: 'mj-bizapps-tasks', Enabled: true },
                { PackageName: '@mj-biz-apps/collaboration-server', StartupExport: 'LoadBizAppsCollaborationServer', AppName: 'mj-bizapps-collaboration', Enabled: true },
                { PackageName: '@mj-biz-apps/collaboration-example-space-types-server', AppName: 'mj-bizapps-collaboration', Enabled: true },
              ],
            },
          };
          EOF
          (cd ../MJ/packages/MJAPI && exec node \
            --import "${{ github.workspace }}/packages/IntegrationTests/dist/world/local-directory-storage.js" \
            --import "${{ github.workspace }}/packages/IntegrationTests/dist/agents/index.js" \
            dist/index.js > /tmp/mjapi.log 2>&1) &
          MJAPI_PID=$!
          for attempt in $(seq 1 60); do
            CODE="$(curl -sS -o /tmp/mjapi-health.json -w '%{http_code}' http://127.0.0.1:4000/healthcheck 2>/dev/null || true)"
            if [ "$CODE" = "200" ]; then
              echo "MJAPI is ready (attempt ${attempt})."
              break
            fi
            if [ "$CODE" = "503" ] && grep -q '"status":"failed"' /tmp/mjapi-health.json 2>/dev/null; then
              cat /tmp/mjapi-health.json
              tail -200 /tmp/mjapi.log
              exit 1
            fi
            if ! kill -0 "$MJAPI_PID" 2>/dev/null; then
              echo "MJAPI exited early"
              tail -200 /tmp/mjapi.log
              exit 1
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "MJAPI timed out"
              tail -200 /tmp/mjapi.log
              exit 1
            fi
            sleep 5
          done
      - name: Client harness, every declared check (GraphQL wire)
        run: pnpm run test:integration:client
      - name: Upload client harness and MJAPI logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-client-log
          path: |
            integration-client.log
            /tmp/mjapi.log
          retention-days: 14
