<mj-record-form-container [Record]="record" [FormComponent]="this"
    (Navigate)="OnFormNavigate($event)"
    (DeleteRequested)="OnDeleteRequested()"
    (FavoriteToggled)="OnFavoriteToggled()"
    (HistoryRequested)="OnHistoryRequested()"
    (ListManagementRequested)="OnListManagementRequested()">

    <mj-form-panel-slot Entity="{{record.EntityInfo.Name}}" Slot="before-fields" [Record]="record" [FormComponent]="this" [FormContext]="formContext"></mj-form-panel-slot>

    <!-- Details Section -->
    <mj-collapsible-panel
        SectionKey="details"
        SectionName="Details"
        Icon="fa fa-align-left"
        [Form]="this"
        [FormContext]="formContext">
        <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="UserID" Type="textbox" [EditMode]="EditMode" [FormContext]="formContext" LinkType="Record"></mj-form-field>
        <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="SpaceID" Type="textbox" [EditMode]="EditMode" [FormContext]="formContext" LinkType="Record"></mj-form-field>
        <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="Cadence" Type="dropdownlist" [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
        <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="LastDeliveredTimestamp" Type="datepicker" [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
        <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="LastDeliveredRecordID" Type="textbox" [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
        <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="LastDeliveredAt" Type="datepicker" [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
        <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="ItemsIncludedCount" Type="numerictextbox" [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
        <mj-form-field [Record]="record" [ShowLabel]="true" FieldName="Status" Type="dropdownlist" [EditMode]="EditMode" [FormContext]="formContext"></mj-form-field>
    </mj-collapsible-panel>

    <mj-form-panel-slot Entity="{{record.EntityInfo.Name}}" Slot="after-fields" [Record]="record" [FormComponent]="this" [FormContext]="formContext"></mj-form-panel-slot>
    <mj-form-panel-slot Entity="{{record.EntityInfo.Name}}" Slot="after-related" [Record]="record" [FormComponent]="this" [FormContext]="formContext"></mj-form-panel-slot>
</mj-record-form-container>
